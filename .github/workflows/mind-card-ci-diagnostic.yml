name: Synthetic real-card POSIX diagnostic
on:
  push:
    branches: [codex-lead-1/real-card-posix-diag-20261111]
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run synthetic fixture with networking isolated
        run: |
          sudo unshare --net -- "$(command -v python)" -m pytest -q -p no:cacheprovider tests/tools/test_real_card_checkpoint_resolution.py tests/tools/test_real_c2_enforcement.py
