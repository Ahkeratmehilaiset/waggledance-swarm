name: Q4 PowerShell refusal phase diagnostic ONLY
on:
  workflow_dispatch:
permissions: {}
jobs:
  refusal-phase-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Probe encoded commands and flushed import markers
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected GitHub-hosted Windows' }
          $scratch = 'C:\wd-adopt-refusal-phase-' + $env:GITHUB_RUN_ID
          if (Test-Path -LiteralPath $scratch) { throw 'Control temporary path already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $probe = @'
          import base64, os, subprocess, time
          from pathlib import Path
          host = 'powershell'
          base = [host, '-NoProfile', '-NonInteractive']
          scratch = Path(os.environ['TEMP'])
          def run(label, script, marker_names):
              encoded = base64.b64encode(script.encode('utf-16-le')).decode('ascii')
              args = base + ['-EncodedCommand', encoded]
              started = time.monotonic()
              wall_started = time.time()
              p = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              try:
                  p.communicate(timeout=20)
                  state = 'completed'
              except subprocess.TimeoutExpired:
                  state = 'timeout'
                  if p.poll() is None:
                      p.kill()
                  try:
                      p.communicate(timeout=2)
                  except subprocess.TimeoutExpired:
                      print(label, 'pipe_remains_open_after_kill', flush=True)
              marks = {}
              for name in marker_names:
                  path = scratch / name
                  marks[name] = round(path.stat().st_mtime - wall_started, 3) if path.is_file() else None
              print(label, state, 'returncode=', p.returncode, 'elapsed=', round(time.monotonic()-started, 3), 'marker_seconds=', marks, flush=True)
          def mark(name):
              return "[IO.File]::WriteAllText([IO.Path]::Combine($env:TEMP,'" + name + "'),'flushed'); "
          join_script = (mark('join-before') + "$p=Join-Path $PSHOME 'Modules\\Microsoft.PowerShell.Utility\\Microsoft.PowerShell.Utility.psd1'; " +
                         mark('join-after') + "Import-Module -Name $p -ErrorAction Stop; " + mark('join-import-after'))
          direct_script = (mark('direct-before') + "$p=[IO.Path]::Combine($PSHOME,'Modules','Microsoft.PowerShell.Utility','Microsoft.PowerShell.Utility.psd1'); " +
                           mark('direct-path-after') + "Import-Module -Name $p -ErrorAction Stop; " + mark('direct-import-after'))
          run('encoded_join_then_import', join_script, ['join-before','join-after','join-import-after'])
          run('encoded_direct_then_import', direct_script, ['direct-before','direct-path-after','direct-import-after'])
          '@
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Get-Command python -ErrorAction Stop).Source
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = (Get-Location).Path
          $psi.Environment.Clear()
          foreach ($key in @('SystemRoot','windir','SystemDrive','ComSpec','PATHEXT','PATH','PROCESSOR_ARCHITECTURE','NUMBER_OF_PROCESSORS')) {
            $value = [Environment]::GetEnvironmentVariable($key)
            if ($value) { $psi.Environment[$key] = $value }
          }
          foreach ($entry in @{TEMP=$scratch; TMP=$scratch; USERPROFILE=$scratch; HOME=$scratch; PYTHONDONTWRITEBYTECODE='1'}.GetEnumerator()) { $psi.Environment[$entry.Key] = $entry.Value }
          foreach ($arg in @('-c',$probe)) { [void]$psi.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($psi)
          if (-not $process.WaitForExit(115000)) { $process.Kill($true); $process.WaitForExit(); throw 'Diagnostic probe timed out' }
          if ($process.ExitCode -ne 0) { throw 'Diagnostic probe failed' }
