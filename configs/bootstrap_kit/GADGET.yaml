# GADGET-profile bootstrap kit — first AI-Assisted Bootstrap Kit
# per ADR-062. Generated by tools/gen_gadget_bootstrap_kit.py.
#
# DO NOT hand-edit. To revise, edit the generator and re-run.
# signature_hash is sha256 over canonical-json of kit minus
# signature_hash itself (BSK-004 / ADR-024 CDC-003 pattern).
#
# Operator action required before stable enable: replace
# validation_results.signed_off_by with operator id + ISO8601
# timestamp. BootstrapKitLoader will reject this kit until then
# (BSK-007 operator_signature_required).

schema_version: bootstrap-kit-v1
profile: GADGET

provenance:
  ai_provider: claude_opus_4_7
  ai_version: "claude-opus-4-7-2026-05-12"
  generated_at_utc: "2026-05-12T15:30:00Z"
  training_data_summary: >-
    1049-observation session corpus 2026-05-12 + bridge events.jsonl
    (2026-05-08..2026-05-12) + ADR-062 contract specification + waggledance
    v3.12.0 substrate. Domain inference from apiary/home defaults + GADGET
