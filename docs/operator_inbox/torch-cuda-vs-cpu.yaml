schema_version: waggledance.operator_decision_pack.v1
decision_id: torch-cuda-vs-cpu
category: dependency_security
created_utc: 2026-05-22T14:00:00Z
author_agent: claude
title: v3.12.0 torch-family upgrade — keep CUDA, go CPU-only, or de-scope
context: >
  OSV reports torch 2.7.1+cu118 (the committed lock) has 5 vulnerability
  entries, which blocks security_privacy_gate for v3.12.0. The cu118 index caps
  at the vulnerable 2.7.1, so a fix requires moving torch. WaggleDance GPU code
  paths (core/micro_model.py, core/translation_proxy.py, core/lora_readiness.py)
  are opportunistic: they degrade to CPU when torch.cuda.is_available() is False,
  EXCEPT LoRA fine-tuning which requires a GPU. A CPU-only torch op was verified
  to run (functional, just slower). This decision is operator-gated because it
  changes a security-relevant dependency and may drop GPU acceleration on the
  operator's Windows machine.
options:
  - id: A1_cpu_only
    summary: Upgrade to torch==2.11.0 (CPU wheels); fixes vulns, drops CUDA/GPU.
    data:
      packages: ["torch==2.11.0", "torchvision==0.26.0", "torchaudio==2.11.0"]
      fixes_osv_vulns: true
      keeps_gpu: false
      functional_impact: "graceful CPU fallback verified; LoRA-on-GPU unavailable; slower local LLM/translation"
      driver_change_required: false
    agent_recommendation: false
  - id: A2_cu126
    summary: Upgrade to torch 2.11.0+cu126 (CUDA build); fixes vulns AND keeps GPU.
    data:
      packages: ["torch==2.11.0+cu126", "torchvision==0.26.0+cu126", "torchaudio==2.11.0+cu126"]
      index_url: "https://download.pytorch.org/whl/cu126"
      fixes_osv_vulns: true
      keeps_gpu: true
      driver_change_required: "CUDA runtime 11.8 -> 12.6 (needs NVIDIA driver supporting CUDA 12.6)"
      caveat: "xformers must move to a cu126-compatible build (verify separately)"
      resolver_correction: "2026-05-22 Codex pip dry-run found torchvision==0.27.0+cu126 depends on torch==2.12.0; corrected to torchvision==0.26.0+cu126 to preserve the signed A2 torch==2.11.0+cu126 strategy."
    agent_recommendation: true
  - id: B_descope
    summary: Drop the torch family from v3.12.0 stable (optional extra only).
    data:
      fixes_osv_vulns: true
      keeps_gpu: false
      functional_impact: "stable loses torch-dependent features (micro-model, opus-mt translation, LoRA)"
    agent_recommendation: false
operator_signoff:
  signed_by: "operator:jani:2026-05-22T18:14:34Z"
  chosen_option: "A2_cu126"
  recorded_by: "claude"
  note: "Operator chose A2_cu126 (keep GPU + fix vulns) and explicitly instructed Claude to record this signoff. Decision authority is the operator; Claude is the scribe. This authorizes the implementation only -- security_privacy_gate flips to pass only after the torch 2.11.0+cu126 lock change lands via PR and a fresh OSV/pip-audit is clean (+ xformers cu126 reconciliation; requires a CUDA 12.6 capable driver)."
  scope_updates:
    - recorded_utc: 2026-05-27T08:14:26Z
      recorded_by: "codex-lead-1"
      source: "bridge:operator-authorization-open-rco-tasks-2026-05-27"
      summary: >
        Operator reconfirmed authorization to proceed on the CUDA dependency
        floor expansions in PR #694 and PR #696 after prior RCO/tools holds.
      authorized_dependency_floors:
        - pr: 694
          package: "nvidia-cublas-cu12"
          requirement: ">=12.9.2.10"
          marker: "sys_platform != 'win32'"
          exact_head: "5705f549f1715f5ef7dc66bcd0c523d5868074ec"
        - pr: 696
          package: "nvidia-cudnn-cu12"
          requirement: ">=9.22.0.52"
          marker: "sys_platform != 'win32'"
          exact_head: "a8045f5ae2f988c9002e8d252021353cadcd92d0"
      review_state: >
        claude-rco-1 emitted RCO_PASS/retract events on the canonical PR tasks
        after this operator authorization; bridge preflight remains required
        before any head-matched merge.
structural_invariants:
