# R22.2 — hex-aligned eval (hub cell)
# 7-cell hex registry, this file = id: hub (q=0,r=0)
# Per operator R22 routing 2026-05-10: 20 utterances/cell × 7 cells = 140 total
solver: cross_domain_dispatch
domain: dispatch
cell: hub
description: "Central dispatch hub — general queries, cross-domain routing"

# 15 positives — keyword-substring-matching utterances (5) + paraphrases that
# challenge the substring heuristic (10) so an LLM can outperform.
positive:
  - "yleinen dispatch-pyyntö"
  - "general query routing"
  - "core dispatcher status"
  - "ohjaa minut oikealle solulle"
  - "cross-domain routing question"
  - "mihin tämä kysymys pitää lähettää"
  - "where should this query go"
  - "I do not know which area handles this"
  - "en tiedä mikä alue käsittelee tätä"
  - "default fallback for unclassified"
  - "this spans multiple domains"
  - "tämä ylittää useita aluerajoja"
  - "route through main coordinator"
  - "lähetä keskuskoordinaattorille"
  - "needs central triage"

# 5 negatives — utterances that clearly belong to other cells.
negative:
  - "hive temperature alert"
  - "frost forecast tomorrow"
  - "fire alarm panel test"
  - "production line OEE"
  - "delivery truck ETA"
