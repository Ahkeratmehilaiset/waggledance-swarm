name: Windows shell advisory

# Deliberately not a PR/push trigger: the six required PR checks are unchanged.
# Dispatch on the reviewed default workflow ref and supply the exact test head.
on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact 40-character source commit to test (not a branch)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-shell-advisory:
    if: ${{ inputs.head != '0a6d6d5dbd2c35d4932bb6e777d17d216bcd6136' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.head }}
    steps:
      - name: Validate exact requested head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_HEAD -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Advisory requires an exact lowercase commit SHA, never a ref'
          }

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install existing bridge test dependencies
        run: python -m pip install pytest PyYAML

      - name: Verify exact checkout and distinct PS5/PS7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git -c http.sslBackend=openssl -c core.longpaths=true rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_HEAD) { throw 'Advisory checkout head mismatch' }
          $ps5 = (Get-Command powershell.exe -ErrorAction Stop).Source
          $ps7 = (Get-Command pwsh.exe -ErrorAction Stop).Source
          $v5 = [string](& $ps5 -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.Major')
          if ($LASTEXITCODE -ne 0) { throw 'PS5 probe failed' }
          $v7 = [int](& $ps7 -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.Major')
          if ($LASTEXITCODE -ne 0) { throw 'PS7 probe failed' }
          if ($v5 -cne '5' -or $v7 -lt 7 -or [string]::Equals($ps5, $ps7, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Two aliases do not establish distinct PS5 and PS7 engines'
          }
          New-Item -ItemType Directory -Path .codex-audit/windows-shell-advisory -Force | Out-Null
          @{schema='wd.windows-shell-advisory.v1';head=$actual;ps5_path=$ps5;ps5_major=$v5;ps7_path=$ps7;ps7_major=$v7;
            observed_utc=[DateTimeOffset]::UtcNow.ToString('o');scope='Exact source test checkout, not installed runtime or RCO_PASS'} |
            ConvertTo-Json | Set-Content .codex-audit/windows-shell-advisory/engines.json -Encoding utf8

      - name: Run affected Windows shell tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $tests = @('tests/tools/test_wd_lead_reply_delivery.py', 'tests/tools/test_wd_native_tools_wake.py')
          # The retirement file exists only on generations containing that change.
          if (Test-Path tests/tools/test_wd_lead_watcher_retirement.py) { $tests += 'tests/tools/test_wd_lead_watcher_retirement.py' }
          python -m pytest @tests -q --tb=short --junitxml=.codex-audit/windows-shell-advisory/junit.xml 2>&1 |
            Tee-Object .codex-audit/windows-shell-advisory/pytest.log
          $code = $LASTEXITCODE
          @{schema='wd.windows-shell-advisory-result.v1';head=$env:EXPECTED_HEAD;pytest_exit=$code;tests=$tests;
            completed_utc=[DateTimeOffset]::UtcNow.ToString('o');required_ci_replacement=$false} |
            ConvertTo-Json | Set-Content .codex-audit/windows-shell-advisory/result.json -Encoding utf8
          exit $code

      - name: Preserve advisory evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-shell-advisory-${{ inputs.head }}-${{ github.run_id }}
          path: .codex-audit/windows-shell-advisory
          if-no-files-found: warn

  # Diagnostic branch only: execute the exact candidate's existing, reviewed
  # offline jobs, not arbitrary workflow input. No required branch check changes.
  continuation-offline-linux:
    if: ${{ inputs.head == '0a6d6d5dbd2c35d4932bb6e777d17d216bcd6136' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0a6d6d5dbd2c35d4932bb6e777d17d216bcd6136
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
      - name: Verify pins and run candidate Linux offline step
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, yaml
          expected_head='0a6d6d5dbd2c35d4932bb6e777d17d216bcd6136'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected_head
          raw=subprocess.check_output(['git','show','HEAD:.github/workflows/mind-adopt-platform-coverage.yml'])
          assert hashlib.sha256(raw).hexdigest()=='4f29a42c0916a14ffb308b70cf02a7c88ecb6edcdfb84ba6fdaf684f2eeaa23d'
          workflow=yaml.safe_load(raw)
          steps=workflow['jobs']['adopt-platform-linux']['steps']
          script=next(step['run'] for step in steps if step.get('name')=='Portable tests with outbound denial')
          data=script.encode('utf-8')
          assert hashlib.sha256(data).hexdigest()=='45fa7a02d928ae916d526a5bcd5c668fc57691be13a47975bd0117c65effe9d2'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'wd-continuation-linux-advisory.sh'
          path.write_bytes(data)
          subprocess.run(['bash',str(path)],check=True)
          PY
      - name: Remove temporary outbound denial even on failure
        if: always()
        shell: bash
        run: |
          rule="wd-adopt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT 2>/dev/null; then sudo iptables -D OUTPUT -m comment --comment "$rule" -j REJECT; fi
          ! sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT 2>/dev/null

  continuation-offline-windows:
    if: ${{ inputs.head == '0a6d6d5dbd2c35d4932bb6e777d17d216bcd6136' }}
    permissions: {}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          ref: 0a6d6d5dbd2c35d4932bb6e777d17d216bcd6136
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare dependencies before offline container
        shell: pwsh
        run: |
          python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - name: Verify pins and run candidate Windows offline step
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference='Stop'
          $extract=@'
          import hashlib, os, pathlib, subprocess, yaml
          expected_head='0a6d6d5dbd2c35d4932bb6e777d17d216bcd6136'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected_head
          raw=subprocess.check_output(['git','show','HEAD:.github/workflows/mind-adopt-platform-coverage.yml'])
          assert hashlib.sha256(raw).hexdigest()=='4f29a42c0916a14ffb308b70cf02a7c88ecb6edcdfb84ba6fdaf684f2eeaa23d'
          workflow=yaml.safe_load(raw)
          steps=workflow['jobs']['adopt-platform-windows']['steps']
          script=next(step['run'] for step in steps if step.get('name')=='Run exact synthetic coverage in offline Windows container')
          data=script.encode('utf-8')
          assert hashlib.sha256(data).hexdigest()=='011cb040d5ddfb582e3f8e52d904d00a1373102b365eac3370975d8fffb80eb3'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'wd-continuation-windows-advisory.ps1'
          path.write_bytes(data)
          '@
          python -c $extract
          if ($LASTEXITCODE -ne 0) { throw 'Pinned advisory extraction failed' }
          & pwsh -NoProfile -NonInteractive -File (Join-Path $env:RUNNER_TEMP 'wd-continuation-windows-advisory.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows offline step failed' }
