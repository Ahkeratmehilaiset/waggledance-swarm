name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  unified-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # full history needed by tests/phase10/test_truth_regression.py (merge-base --is-ancestor against squash-merge SHAs)

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvoikko1 voikko-fi

    - name: Install Python dependencies
      run: |
        pip install -r requirements-ci.txt 2>&1 | tee /tmp/pip-install.log
        echo "--- pip install completed ---"

    - name: Upload pip log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: pip-install-log
        path: /tmp/pip-install.log

    - name: Compile all Python files
      run: |
        python -m compileall core memory web waggledance backend integrations tests -q

    - name: Run legacy tests (informational)
      run: |
        python tests/run_all.py --skip-ollama || echo "Legacy tests exited $? (expected without Ollama)"

    - name: Run pytest
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Run benchmark baseline
      run: |
        mkdir -p data
        python tools/run_benchmark.py --yaml configs/benchmarks.yaml

    - name: Upload benchmark artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-v2_0
        path: |
          data/benchmark_v1_18.json
          data/benchmark_v1_18_summary.md

  lock-resolver-check:
    # Catches cross-package resolver conflicts in requirements.lock.txt at
    # PR time (e.g. PR #584's moviepy<12.0 vs pillow==12.2.0 conflict that
    # the static lock-floor tests cannot surface). See
    # tools/check_lock_resolves.py for the implementation contract.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Run lock resolver gate (dry-run, fail-closed)
      run: |
        python tools/check_lock_resolves.py \
          --lock-file requirements.lock.txt \
          --extra-index-url https://download.pytorch.org/whl/cu126 \
          --output /tmp/lock_resolver_report.json

    - name: Upload resolver report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lock-resolver-report
        path: /tmp/lock_resolver_report.json

  release-evidence-runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Enable Git long paths for checkout
      shell: pwsh
      run: |
        git config --global core.longpaths true
        git config --global core.autocrlf false
        if ((git config --global --get core.longpaths) -cne "true") {
          throw "Git long-path support was not enabled."
        }
        if ((git config --global --get core.autocrlf) -cne "false") {
          throw "Git line-ending conversion was not disabled."
        }

    - name: Check out the triggering exact head
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify the checked-out head
      shell: pwsh
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        $actualHead = git rev-parse HEAD
        if ($LASTEXITCODE -ne 0 -or $actualHead -ne $env:EXPECTED_HEAD) {
          throw "Checked-out HEAD '$actualHead' does not match triggering head '$env:EXPECTED_HEAD'."
        }

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install focused test dependency
      run: python -m pip install --disable-pip-version-check pytest==9.0.3

    - name: Run release evidence runtime tests on Windows
      run: python -m pytest tests/tools/test_release_evidence_runtime.py -v --tb=short

  unified:
    if: ${{ always() }}
    needs:
      - unified-ubuntu
      - release-evidence-runtime-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - name: Require Ubuntu and Windows test leaves
      shell: bash
      env:
        UBUNTU_RESULT: ${{ needs.unified-ubuntu.result }}
        WINDOWS_RESULT: ${{ needs.release-evidence-runtime-windows.result }}
      run: |
        test "$UBUNTU_RESULT" = "success"
        test "$WINDOWS_RESULT" = "success"
