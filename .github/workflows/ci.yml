name: WaggleDance CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Stable across heads of one PR, distinct across workflows and non-PR runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || 'run' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history needed by tests/phase10/test_truth_regression.py (merge-base --is-ancestor against squash-merge SHAs)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Security check — no eval() in solver
        run: |
          HITS=$(grep -cn '[^_]eval(' core/symbolic_solver.py | grep -v safe_eval || true)
          RAW=$(grep -n 'eval(' core/symbolic_solver.py | grep -v safe_eval | wc -l)
          if [ "$RAW" -gt 0 ]; then
            grep -n 'eval(' core/symbolic_solver.py | grep -v safe_eval
            echo "Raw eval() found in symbolic_solver.py!"
            exit 1
          fi
          echo "No raw eval() in solver"

      - name: Security check — safe_eval blocks RCE
        run: |
          python -c "
          from core.safe_eval import safe_eval, SafeEvalError
          assert safe_eval('2+3', {}) == 5
          try:
              safe_eval('__import__(\"os\")', {})
              exit(1)
          except SafeEvalError:
              pass
          print('Security OK')
          "

      - name: Run tests
        run: |
          pytest tests/ -x -q --tb=short -p no:warnings
          python -m pytest sandbox/mind/test_mind_capture_producer_reader.py sandbox/mind/test_mind_capture_producer_state.py sandbox/mind/test_join_turn.py sandbox/mind/test_join_card.py sandbox/mind/test_join_card_delivery.py sandbox/mind/step1/test_adapter.py sandbox/mind/step1/test_lane_view.py sandbox/mind/capture/test_capacity_lens.py sandbox/mind/capture/test_overlap_lens.py sandbox/mind/test_mind_chain_driver.py sandbox/mind/step2/test_q4_readonly_port.py sandbox/mind/step2/test_encode_identity_budget.py sandbox/mind/step2/test_wd_q4_private_read.py sandbox/mind/step2/test_interpreter_identity.py sandbox/mind/step2/test_reader_slot.py sandbox/mind/step2/test_runtime_manifest.py sandbox/mind/step2/test_runtime_bootstrap.py sandbox/mind/step2/test_runtime_builder.py sandbox/mind/step2/test_runtime_launcher.py sandbox/mind/step2/test_shared_projection.py sandbox/mind/step2/test_shared_projection_q4_synthetic.py sandbox/mind/step2/test_shared_result_resolver.py sandbox/mind/step2/test_shared_capture_adapter.py sandbox/mind/step2/test_shared_bridge_snapshot.py sandbox/mind/step2/test_shared_index_checkpoint.py sandbox/mind/step2/test_shared_index_checkpoint_snapshot.py sandbox/mind/step2/test_shared_index_checkpoint_active_snapshot.py sandbox/mind/step2/test_shared_index_builder.py sandbox/mind/step2/test_shared_source_anchor.py sandbox/mind/step2/test_shared_strict_chain.py sandbox/mind/step2/test_shared_builder_e2e.py sandbox/mind/step2/test_shared_history.py sandbox/mind/step2/test_shared_index_watermark.py sandbox/mind/step2/test_shared_index_history_commit.py sandbox/mind/step2/test_status_metadata_producer.py sandbox/mind/step2/test_status_public_filter.py sandbox/mind/step2/test_shared_producer.py sandbox/mind/step2/test_prefix_builder_v1.py sandbox/mind/step2/test_prefix_checkpoint_v1.py sandbox/mind/step2/test_shared_prefix_pin.py sandbox/mind/step2/test_shared_prefix_public_producer.py sandbox/mind/step2/test_prefix_private_state.py sandbox/mind/test_mind_capture_producer_graphql.py -x -q --tb=short -p no:warnings

      - name: Run synthetic Mind cell witnesses
        run: python -B tools/run_mind_cell_synthetic_ci.py

      - name: Run portable Mind prefix witnesses
        run: python -B tools/run_mind_prefix_portable_ci.py

      - name: Check test count
        run: |
          # Fail closed: a failed collection, or a summary that is not exactly one
          # "<N> tests collected in <T>s" line, must not pass (K 011920df job
          # 113510581050 read "28144 13 80" from the duration and still passed).
          if ! OUT=$(pytest tests/ --collect-only -q 2>/dev/null); then
            echo "Test collection failed"
            exit 1
          fi
          # Exactly one summary-like line, and it is the last line; the count has
          # at most 9 digits so the integer test below cannot overflow. From 60 s on
          # pytest appends " (H:MM:SS)"; a longer suffix (a day count) is refused.
          SUMMARIES=$(printf '%s\n' "$OUT" | grep -cE '^[0-9]+ tests? collected' || true)
          if [ "$SUMMARIES" != "1" ]; then
            echo "Expected exactly one collection summary, found: $SUMMARIES"
            exit 1
          fi
          LAST=$(printf '%s\n' "$OUT" | tail -1)
          if ! [[ "$LAST" =~ ^([1-9][0-9]{0,8})\ tests?\ collected\ in\ [0-9]+(\.[0-9]+)?s(\ \([0-9]{1,2}:[0-5][0-9]:[0-5][0-9]\))?$ ]]; then
            echo "Unrecognized collection summary: $LAST"
            exit 1
          fi
          COUNT=${BASH_REMATCH[1]}
          echo "Test count: $COUNT"
          if ! [ "$COUNT" -ge 4200 ]; then
            echo "Test count dropped below 4200!"
            exit 1
          fi
          # Keep the existing tests/ floor independent: Mind must never mask a drop.
          if ! MIND_OUT=$(python -m pytest sandbox/mind/test_mind_capture_producer_reader.py sandbox/mind/test_mind_capture_producer_state.py sandbox/mind/test_join_turn.py sandbox/mind/test_join_card.py sandbox/mind/test_join_card_delivery.py sandbox/mind/step1/test_adapter.py sandbox/mind/step1/test_lane_view.py sandbox/mind/capture/test_capacity_lens.py sandbox/mind/capture/test_overlap_lens.py sandbox/mind/test_mind_chain_driver.py sandbox/mind/step2/test_q4_readonly_port.py sandbox/mind/step2/test_encode_identity_budget.py sandbox/mind/step2/test_wd_q4_private_read.py sandbox/mind/step2/test_interpreter_identity.py sandbox/mind/step2/test_reader_slot.py sandbox/mind/step2/test_runtime_manifest.py sandbox/mind/step2/test_runtime_bootstrap.py sandbox/mind/step2/test_runtime_builder.py sandbox/mind/step2/test_runtime_launcher.py sandbox/mind/step2/test_shared_projection.py sandbox/mind/step2/test_shared_projection_q4_synthetic.py sandbox/mind/step2/test_shared_result_resolver.py sandbox/mind/step2/test_shared_capture_adapter.py sandbox/mind/step2/test_shared_bridge_snapshot.py sandbox/mind/step2/test_shared_index_checkpoint.py sandbox/mind/step2/test_shared_index_checkpoint_snapshot.py sandbox/mind/step2/test_shared_index_checkpoint_active_snapshot.py sandbox/mind/step2/test_shared_index_builder.py sandbox/mind/step2/test_shared_source_anchor.py sandbox/mind/step2/test_shared_strict_chain.py sandbox/mind/step2/test_shared_builder_e2e.py sandbox/mind/step2/test_shared_history.py sandbox/mind/step2/test_shared_index_watermark.py sandbox/mind/step2/test_shared_index_history_commit.py sandbox/mind/step2/test_status_metadata_producer.py sandbox/mind/step2/test_status_public_filter.py sandbox/mind/step2/test_shared_producer.py sandbox/mind/step2/test_prefix_builder_v1.py sandbox/mind/step2/test_prefix_checkpoint_v1.py sandbox/mind/step2/test_shared_prefix_pin.py sandbox/mind/step2/test_shared_prefix_public_producer.py sandbox/mind/step2/test_prefix_private_state.py sandbox/mind/test_mind_capture_producer_graphql.py --collect-only -q 2>/dev/null); then
            echo "Mind test collection failed"
            exit 1
          fi
          MIND_SUMMARIES=$(printf '%s\n' "$MIND_OUT" | grep -cE '^[0-9]+ tests? collected' || true)
          if [ "$MIND_SUMMARIES" != "1" ]; then
            echo "Expected exactly one Mind collection summary"
            exit 1
          fi
          MIND_LAST=$(printf '%s\n' "$MIND_OUT" | tail -1)
          if ! [[ "$MIND_LAST" =~ ^([1-9][0-9]{0,8})\ tests?\ collected\ in\ [0-9]+(\.[0-9]+)?s(\ \([0-9]{1,2}:[0-5][0-9]:[0-5][0-9]\))?$ ]]; then
            echo "Unrecognized Mind collection summary"
            exit 1
          fi
          echo "Mind test count: ${BASH_REMATCH[1]}"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for dangerous patterns
        run: |
          echo "=== Checking for eval() outside safe_eval ==="
          EVAL_HITS=$(grep -rn "eval(" --include="*.py" core/ waggledance/ \
            | grep -v safe_eval | grep -v "# noqa" | grep -v "test_" \
            | grep -v '\.eval()' | grep -v 'retrieval(' | grep -v 'evaluate(' | wc -l)
          echo "eval() hits outside safe_eval: $EVAL_HITS"
          if [ "$EVAL_HITS" -gt 0 ]; then
            grep -rn "eval(" --include="*.py" core/ waggledance/ \
              | grep -v safe_eval | grep -v "# noqa" | grep -v "test_" \
              | grep -v '\.eval()' | grep -v 'retrieval(' | grep -v 'evaluate('
            echo "Unauthorized eval() found!"
            exit 1
          fi
          echo "No unauthorized eval()"

          echo "=== Checking for plaintext MQTT ==="
          grep -rn "port.*1883" --include="*.py" core/ waggledance/ | grep -v test | grep -v "# TLS" && exit 1 || echo "No hardcoded 1883"

  adopt-platform-linux:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
      - name: Portable tests with outbound denial
        shell: bash
        run: |
          set -euo pipefail
          command -v pwsh
          scratch="$RUNNER_TEMP/wd-adopt-$GITHUB_RUN_ID"
          mkdir -p "$scratch/home" "$scratch/tmp"
          rule="wd-adopt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() { sudo iptables -D OUTPUT -m comment --comment "$rule" -j REJECT; }
          sudo iptables -I OUTPUT 1 -m comment --comment "$rule" -j REJECT
          trap cleanup EXIT
          sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT
          env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" python -c 'import socket; s=socket.socket(); s.settimeout(2); r=s.connect_ex(("1.1.1.1",443)); s.close(); assert r != 0'
          env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py -q -rs -p no:cacheprovider --basetemp "$scratch/pytest" --junitxml "$scratch/results.xml"
          env -i PATH="$PATH" HOME="$scratch/home" python -c 'import sys,xml.etree.ElementTree as E; s=E.parse(sys.argv[1]).getroot().find("testsuite"); c=s.findall("testcase"); p={x.attrib["name"] for x in c if x.find("skipped") is None}; e={"test_default_off","test_bad_pins_refuse_without_job","test_marker_window_starts_after_synthetic_preflight","test_preflight_and_marker_waits_remain_bounded[False]","test_preflight_and_marker_waits_remain_bounded[True]"}; assert len(c)==38 and p==e and s.attrib["skipped"]=="33" and s.attrib["failures"]=="0" and s.attrib["errors"]=="0"; print("verified Linux: 5 passed, 33 skipped")' "$scratch/results.xml"
      - name: Cleanup firewall
        if: always()
        shell: bash
        run: |
          rule="wd-adopt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT 2>/dev/null; then sudo iptables -D OUTPUT -m comment --comment "$rule" -j REJECT; fi
          ! sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT 2>/dev/null
  adopt-platform-windows:
    permissions: {}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare dependencies before offline container
        shell: pwsh
        run: |
          python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - name: Run exact synthetic coverage in offline Windows container
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected disposable hosted Windows' }
          $service = Get-Service -Name docker -ErrorAction Stop
          if ($service.Status -ne 'Running') { Start-Service docker }
          $positive=[Net.Sockets.TcpClient]::new()
          try { $a=$positive.BeginConnect('140.82.114.4',443,$null,$null); if (-not $a.AsyncWaitHandle.WaitOne(5000)) { throw 'Positive network control timed out' }; $positive.EndConnect($a) } finally { $positive.Dispose() }
          Write-Output 'Host positive network control connected'
          $image = 'mcr.microsoft.com/windows/servercore@sha256:c622317822fefb54a056fd09ab51f5bb48390feb47abb2b8696b2c526bdce4ef'
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw 'Image unavailable' }
          $scratch = Join-Path $env:RUNNER_TEMP 'wd-synthetic-archive'
          New-Item -ItemType Directory -Path "$scratch\repo" -Force | Out-Null
          # Source-only subset used by the synthetic fixture. Never archive .git,
          # documents, runtime data or the host workspace outside tracked source.
          $sourcePaths = @('pyproject.toml','tests/conftest.py',':(glob)tests/tools/test_wd_q4*.py',':(glob)tools/*.py',':(glob)tools/**/*.py',':(glob)sandbox/mind/step2/*.py',':(glob)sandbox/mind/step2/**/*.py',':(glob)waggledance/**/*.py',':(glob)core/*.py',':(glob)core/**/*.py',':(glob)ops/windows/reboot/*.ps1')
          git archive --format=tar --output "$scratch\repo.tar" HEAD -- $sourcePaths
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          tar -xf "$scratch\repo.tar" -C "$scratch\repo"
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          $pythonRoot = (& python -c 'import sys; print(sys.base_prefix)').Trim()
          $inner = @'
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:\wdtmp -Force | Out-Null
          $env:TEMP='C:\wdtmp'; $env:TMP='C:\wdtmp'; $env:HOME='C:\wdtmp'; $env:USERPROFILE='C:\wdtmp'
          $env:PATH='C:\Python;C:\Python\Scripts;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw 'Windows PowerShell is not on PATH' }
          $env:PYTHONDONTWRITEBYTECODE='1'; $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'
          if (Get-ChildItem Env: | Where-Object { $_.Name -match '(?i)token|secret|password|credential|^GITHUB_' }) { throw 'Unexpected credential-like environment key' }
          if ($env:WD_Q4_ADOPT_JOB_E2E) { throw 'Live runtime opt-in present' }
          $s=[Net.Sockets.TcpClient]::new()
          try { $a=$s.BeginConnect('140.82.114.4',443,$null,$null); if ($a.AsyncWaitHandle.WaitOne(5000)) { $s.EndConnect($a); throw 'Network connected' } } catch [System.Net.Sockets.SocketException] { Write-Output 'Socket denied' } finally { $s.Dispose() }
          & C:\Python\python.exe -c "import socket; s=socket.socket(); s.settimeout(3); r=s.connect_ex(('140.82.114.4',443)); s.close(); assert r != 0"
          if ($LASTEXITCODE -ne 0) { throw 'Python network control failed' }
          Set-Location C:\work
          & C:\Python\python.exe -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py -q -rs -p no:cacheprovider --basetemp C:\wdtmp\pytest --junitxml C:\wdtmp\results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic tests failed' }
          [xml]$result = Get-Content -Raw C:\wdtmp\results.xml
          $suite=$result.testsuites.testsuite; $cases=@($suite.testcase); $skipped=@($cases | Where-Object {$_.skipped})
          $expected=@('test_real_job_finishes_proven_early_refusal','test_stdout_error_after_real_f3_mutation_is_unknown')
          if ($cases.Count -ne 38 -or $skipped.Count -ne 2 -or @($skipped | Where-Object {$_.name -notin $expected}).Count -ne 0 -or $suite.failures -ne '0' -or $suite.errors -ne '0') { throw 'Coverage mismatch' }
          Write-Output 'Windows coverage: 36 passed and two opt-in skipped'
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inner))
          $cid = docker create --network none --workdir C:\work $image powershell.exe -NoProfile -NonInteractive -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw 'Offline container creation failed' }
          try {
            $network=docker inspect --format '{{.HostConfig.NetworkMode}}' $cid
            if ($network -ne 'none') { throw 'Container network not isolated' }
            $mounts=docker inspect --format '{{json .Mounts}}' $cid
            if ($mounts -notin @('[]','null')) { throw 'Unexpected container mounts' }
            docker cp "$pythonRoot\." "${cid}:C:\Python"
            if ($LASTEXITCODE -ne 0) { throw 'Python copy failed' }
            docker cp "$scratch\repo\." "${cid}:C:\work"
            if ($LASTEXITCODE -ne 0) { throw 'Repository copy failed' }
            docker start -a $cid
            if ($LASTEXITCODE -ne 0) { throw 'Offline container test failed' }
            $code=docker inspect --format '{{.State.ExitCode}}' $cid
            if ($code -ne '0') { throw "Offline container exited $code" }
          } finally { docker rm -f $cid }
