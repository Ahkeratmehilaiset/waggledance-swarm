name: Disposable Windows isolation capability probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Inspect container host without starting tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "OS=$([System.Environment]::OSVersion.VersionString)"
          $dockerService = Get-Service -Name docker -ErrorAction SilentlyContinue
          if ($null -eq $dockerService) { throw 'Docker service is not installed' }
          Write-Output "DockerServiceBefore=$($dockerService.Status)"
          if ($dockerService.Status -ne 'Running') { Start-Service -Name docker }
          Write-Output "DockerServiceAfter=$((Get-Service -Name docker).Status)"
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}} os={{.Server.Os}}'
          if ($LASTEXITCODE -ne 0) { throw 'Docker engine unavailable' }
          docker image ls --format '{{.Repository}}:{{.Tag}}'
          if ($LASTEXITCODE -ne 0) { throw 'Docker image inventory failed' }
      - name: Verify container-wide network isolation without project code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $socket = [Net.Sockets.TcpClient]::new()
          try {
            $pending = $socket.BeginConnect('140.82.114.4', 443, $null, $null)
            if (-not $pending.AsyncWaitHandle.WaitOne(5000)) { throw 'Host positive network control timed out' }
            $socket.EndConnect($pending)
            Write-Output 'Host network positive control: connected'
          } finally { $socket.Dispose() }
          docker pull mcr.microsoft.com/windows/servercore:ltsc2025
          if ($LASTEXITCODE -ne 0) { throw 'Image provisioning failed' }
          $inner = '$s=[Net.Sockets.TcpClient]::new();try{$a=$s.BeginConnect("140.82.114.4",443,$null,$null);if($a.AsyncWaitHandle.WaitOne(5000)){$s.EndConnect($a);exit 23};Write-Output "isolated: denied";exit 0}catch{Write-Output "isolated: denied";exit 0}finally{$s.Dispose()}'
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inner))
          $cid = docker create --network none mcr.microsoft.com/windows/servercore:ltsc2025 powershell.exe -NoProfile -NonInteractive -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create isolated container' }
          try {
            $network = docker inspect --format '{{.HostConfig.NetworkMode}}' $cid
            if ($network -ne 'none') { throw "Unexpected network mode: $network" }
            docker start -a $cid
            if ($LASTEXITCODE -ne 0) { throw 'Isolated network check failed' }
          } finally { docker rm -f $cid }
