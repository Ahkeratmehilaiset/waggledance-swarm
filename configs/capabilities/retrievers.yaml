capabilities:
  - id: retrieve.hot_cache
    category: RETRIEVE
    description: "In-memory LRU cache with TTL"
    legacy_module: core.fast_memory
    legacy_class: HotCache
    preconditions: []
    success_criteria:
      - "cache hit found"
    rollback_possible: true
    max_latency_ms: 5
    trust_baseline: 0.99

  # Metadata only. The builtin registry already defines this capability
  # with a non-empty description, and load_yaml_configs() applies a YAML
  # description ONLY when the existing one is empty - so this wording is
  # file truth and does not replace the builtin description at runtime.
  # max_latency_ms and trust_baseline below ARE applied to the builtin
  # entry; they are deliberately left unchanged.
  - id: retrieve.semantic_search
    category: RETRIEVE
    description: "Semantic similarity search over the bound vector backend (Chroma when selected and installed via the [chroma] extra; the non-persistent in-memory store only when explicitly requested)"
    legacy_module: core.memory_engine
    preconditions:
      - "embedding model available"
      - "configured vector backend available"
    success_criteria:
      - "results returned with score > threshold"
    rollback_possible: true
    max_latency_ms: 500
    trust_baseline: 0.85

  - id: retrieve.vector_search
    category: RETRIEVE
    description: "FAISS vector similarity search (IndexFlatIP cosine)"
    legacy_module: core.faiss_store
    legacy_class: FaissRegistry
    preconditions:
      - "FAISS index loaded"
    success_criteria:
      - "cosine similarity > 0.35"
    rollback_possible: true
    max_latency_ms: 100
    trust_baseline: 0.82
