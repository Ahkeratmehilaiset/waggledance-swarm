[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waggledance-swarm"
version = "3.12.0"
description = "Local-first multi-agent AI runtime — solver-first, autonomous overnight learning, full audit trail"
readme = "README.md"
license = "Apache-2.0 AND BUSL-1.1"
license-files = ["LICENSE", "LICENSE-BUSL.txt", "LICENSE-CORE.md"]
requires-python = ">=3.11"
keywords = [
    "local-first", "multi-agent", "ai-runtime", "solver-first",
    "autonomous-learning", "iot", "smart-home", "mqtt",
    "ollama", "pytorch", "sklearn", "chromadb",
]
authors = [
    {name = "Jani Korpi"}
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "chromadb>=1.0.0",
    "transformers>=4.40.0",
    "torch>=2.11.0",
    "sentencepiece>=0.1.99",
    "duckduckgo-search>=6.0",
    "aiohttp>=3.13.4",
    "feedparser>=6.0.11",
    "anthropic>=0.30.0",
    "paho-mqtt>=2.0.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
]
audio = [
    "scipy>=1.12.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
lora = [
    "peft>=0.11.0",
    "accelerate>=0.30.0",
]

[project.scripts]
waggledance = "waggledance.adapters.cli.start_runtime:main"
# The 8 deterministic v3_13_0 solver CLIs, installed as console scripts so a
# user can run each solver directly (e.g. `wd-air01 --input sensor.json`).
# Each target is the module's argv-parsing main(); keep in sync with the
# cli_module fields in schemas/v3_13_0/solver_registry.json.
wd-eng01 = "waggledance.adapters.cli.eng01_recommend:main"
wd-eng06 = "waggledance.adapters.cli.eng06_fireplace:main"
wd-air01 = "waggledance.adapters.cli.air01_advisory:main"
wd-pdf01 = "waggledance.adapters.cli.pdf01_extract_invoice:main"
wd-acct01 = "waggledance.adapters.cli.acct01_reconcile_bills:main"
wd-fin10 = "waggledance.adapters.cli.fin10_classify_receipts:main"
wd-email01 = "waggledance.adapters.cli.email01_classify_inbox:main"
wd-email02 = "waggledance.adapters.cli.email02_index_vendor_emails:main"

[project.urls]
Homepage = "https://github.com/Ahkeratmehilaiset/waggledance-swarm"
Issues = "https://github.com/Ahkeratmehilaiset/waggledance-swarm/issues"

[tool.setuptools.packages.find]
# Explicit include list — the project root contains many sibling top-level
# directories (data/, models/, chroma_data/, etc.) that setuptools flat-layout
# auto-discovery would refuse to ingest. Only ship the hexagonal runtime plus
# the feed integration adapters that the runtime imports lazily.
include = ["waggledance*", "integrations*"]
exclude = [
    "tests*",
    "configs*",
    "docs*",
    "reports*",
    "output*",
    "memory*",
    "models*",
    "chroma_data*",
    "data*",
    "_archive*",
    "legacy*",
    "overnight_run*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "strict"
