name: Synthetic caller CLI Linux diagnostic
on:
  push:
    branches: [diag/q4-caller-cli-linux-20261111]
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install 'pytest>=9.0.3'
      - name: Test synthetic caller without inherited environment or network
        run: |
          sudo unshare --net -- env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" "$(command -v python)" -m pytest -q -p no:cacheprovider tests/tools/test_wd_q4_lane_caller_cli.py::test_enabled_cli_and_real_adapter_parent_path_needs_no_model_import
