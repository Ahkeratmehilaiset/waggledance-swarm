name: Mind adoption platform coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || 'run' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adopt-platform-linux:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
      - name: Portable tests with outbound denial
        shell: bash
        run: |
          set -euo pipefail
          command -v pwsh
          scratch="$RUNNER_TEMP/wd-adopt-$GITHUB_RUN_ID"
          mkdir -p "$scratch/home" "$scratch/tmp"
          rule="wd-adopt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() { sudo iptables -D OUTPUT -m comment --comment "$rule" -j REJECT; }
          sudo iptables -I OUTPUT 1 -m comment --comment "$rule" -j REJECT
          trap cleanup EXIT
          sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT
          env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" python -c 'import socket; s=socket.socket(); s.settimeout(2); r=s.connect_ex(("1.1.1.1",443)); s.close(); assert r != 0'
          mkdir -p "$scratch/source"
          git archive --format=tar --output "$scratch/source.tar" HEAD -- 'pyproject.toml' 'tests/conftest.py' 'tests/tools/test_card_source_binding.py' 'tests/tools/test_lane_card_decision_forward.py' 'tests/tools/test_public_card_decision_forward.py' 'tests/tools/test_shared_card_projection.py' 'tests/tools/test_shared_card_route.py' ':(glob)tests/tools/test_wd_q4*.py' ':(glob)tools/*.py' ':(glob)tools/**/*.py' ':(glob)sandbox/mind/*.py' ':(glob)sandbox/mind/**/*.py' ':(glob)waggledance/**/*.py' ':(glob)core/*.py' ':(glob)core/**/*.py' ':(glob)ops/windows/reboot/*.ps1'
          tar -xf "$scratch/source.tar" -C "$scratch/source"
          ( cd "$scratch/source"; env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py --collect-only -q -p no:cacheprovider > "$scratch/collected.txt" )
          cat "$scratch/collected.txt"
          grep -E '^38 tests collected' "$scratch/collected.txt"
          env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py -q -rs -p no:cacheprovider --basetemp "$scratch/pytest" --junitxml "$scratch/results.xml"
          env -i PATH="$PATH" HOME="$scratch/home" python -c 'import sys,xml.etree.ElementTree as E; s=E.parse(sys.argv[1]).getroot().find("testsuite"); c=s.findall("testcase"); p={x.attrib["name"] for x in c if x.find("skipped") is None}; e={"test_default_off","test_bad_pins_refuse_without_job","test_marker_window_starts_after_synthetic_preflight","test_preflight_and_marker_waits_remain_bounded[False]","test_preflight_and_marker_waits_remain_bounded[True]"}; assert len(c)==38 and p==e and s.attrib["skipped"]=="33" and s.attrib["failures"]=="0" and s.attrib["errors"]=="0"; print("verified Linux: 5 passed, 33 skipped")' "$scratch/results.xml"
      - name: Cleanup firewall
        if: always()
        shell: bash
        run: |
          rule="wd-adopt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT 2>/dev/null; then sudo iptables -D OUTPUT -m comment --comment "$rule" -j REJECT; fi
          ! sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT 2>/dev/null
  adopt-platform-windows:
    permissions: {}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare dependencies before offline container
        shell: pwsh
        run: |
          python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - name: Run exact synthetic coverage in offline Windows container
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected disposable hosted Windows' }
          $service = Get-Service -Name docker -ErrorAction Stop
          if ($service.Status -ne 'Running') { Start-Service docker }
          $positive=[Net.Sockets.TcpClient]::new()
          try { $a=$positive.BeginConnect('140.82.114.4',443,$null,$null); if (-not $a.AsyncWaitHandle.WaitOne(5000)) { throw 'Positive network control timed out' }; $positive.EndConnect($a) } finally { $positive.Dispose() }
          Write-Output 'Host positive network control connected'
          $image = 'mcr.microsoft.com/windows/servercore@sha256:c622317822fefb54a056fd09ab51f5bb48390feb47abb2b8696b2c526bdce4ef'
          $scratch = Join-Path $env:RUNNER_TEMP 'wd-synthetic-archive'
          New-Item -ItemType Directory -Path "$scratch\repo" -Force | Out-Null
          # Source-only subset used by the synthetic fixture. Never archive .git,
          # documents, runtime data or the host workspace outside tracked source.
          $sourcePaths = @('pyproject.toml','tests/conftest.py','tests/tools/test_card_source_binding.py','tests/tools/test_lane_card_decision_forward.py','tests/tools/test_public_card_decision_forward.py','tests/tools/test_shared_card_projection.py','tests/tools/test_shared_card_route.py',':(glob)tests/tools/test_wd_q4*.py',':(glob)tools/*.py',':(glob)tools/**/*.py',':(glob)sandbox/mind/*.py',':(glob)sandbox/mind/**/*.py',':(glob)waggledance/**/*.py',':(glob)core/*.py',':(glob)core/**/*.py',':(glob)ops/windows/reboot/*.ps1')
          git archive --format=tar --output "$scratch\repo.tar" HEAD -- $sourcePaths
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          tar -xf "$scratch\repo.tar" -C "$scratch\repo"
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          # Parse, never import, reachable fixture modules; check static imports and
          # literal spec_from_file_location/with_name targets against the archive.
          $closure = @'
          import ast, pathlib, re, sys
          root=pathlib.Path('tests/tools'); staged=pathlib.Path(sys.argv[1])/'tests/tools'
          todo=['test_wd_q4_adopt_recovery_ps']; seen=set()
          while todo:
              name=todo.pop()
              if name in seen: continue
              seen.add(name); original=root/(name+'.py'); copy=staged/(name+'.py')
              if not original.is_file() or not copy.is_file(): raise SystemExit('missing fixture: '+name)
              tree=ast.parse(original.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node,ast.ImportFrom) and node.module:
                      if node.module.startswith('tests.tools.test_'): todo.append(node.module.split('.')[2])
                      if node.module=='tests.tools': todo.extend(a.name for a in node.names if a.name.startswith('test_'))
                  if isinstance(node,ast.Import):
                      todo.extend(a.name.split('.')[2] for a in node.names if a.name.startswith('tests.tools.test_'))
                  if isinstance(node,ast.Constant) and isinstance(node.value,str):
                      for dep in re.findall(r'(?:tests[/\\]tools[/\\])?(test_[a-zA-Z0-9_]+)\.py',node.value):
                          if (root/(dep+'.py')).is_file(): todo.append(dep)
          print('static fixture closure present:',len(seen))
          '@
          python -c $closure "$scratch\repo"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture source closure incomplete' }
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw 'Image unavailable' }
          $pythonRoot = (& python -c 'import sys; print(sys.base_prefix)').Trim()
          $inner = @'
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:\wdtmp -Force | Out-Null
          $env:TEMP='C:\wdtmp'; $env:TMP='C:\wdtmp'; $env:HOME='C:\wdtmp'; $env:USERPROFILE='C:\wdtmp'
          $env:PATH='C:\Python;C:\Python\Scripts;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw 'Windows PowerShell is not on PATH' }
          $env:PYTHONDONTWRITEBYTECODE='1'; $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'
          if (Get-ChildItem Env: | Where-Object { $_.Name -match '(?i)token|secret|password|credential|^GITHUB_' }) { throw 'Unexpected credential-like environment key' }
          if ($env:WD_Q4_ADOPT_JOB_E2E) { throw 'Live runtime opt-in present' }
          $s=[Net.Sockets.TcpClient]::new()
          try { $a=$s.BeginConnect('140.82.114.4',443,$null,$null); if ($a.AsyncWaitHandle.WaitOne(5000)) { $s.EndConnect($a); throw 'Network connected' } } catch [System.Net.Sockets.SocketException] { Write-Output 'Socket denied' } finally { $s.Dispose() }
          & C:\Python\python.exe -c "import socket; s=socket.socket(); s.settimeout(3); r=s.connect_ex(('140.82.114.4',443)); s.close(); assert r != 0"
          if ($LASTEXITCODE -ne 0) { throw 'Python network control failed' }
          Set-Location C:\work
          & C:\Python\python.exe -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py -q -rs -p no:cacheprovider --basetemp C:\wdtmp\pytest --junitxml C:\wdtmp\results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic tests failed' }
          [xml]$result = Get-Content -Raw C:\wdtmp\results.xml
          $suite=$result.testsuites.testsuite; $cases=@($suite.testcase); $skipped=@($cases | Where-Object {$_.skipped})
          $expected=@('test_real_job_finishes_proven_early_refusal','test_stdout_error_after_real_f3_mutation_is_unknown')
          if ($cases.Count -ne 38 -or $skipped.Count -ne 2 -or @($skipped | Where-Object {$_.name -notin $expected}).Count -ne 0 -or $suite.failures -ne '0' -or $suite.errors -ne '0') { throw 'Coverage mismatch' }
          Write-Output 'Windows coverage: 36 passed and two opt-in skipped'
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inner))
          $cid = docker create --network none --workdir C:\work $image powershell.exe -NoProfile -NonInteractive -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw 'Offline container creation failed' }
          try {
            $network=docker inspect --format '{{.HostConfig.NetworkMode}}' $cid
            if ($network -ne 'none') { throw 'Container network not isolated' }
            $mounts=docker inspect --format '{{json .Mounts}}' $cid
            if ($mounts -notin @('[]','null')) { throw 'Unexpected container mounts' }
            docker cp "$pythonRoot\." "${cid}:C:\Python"
            if ($LASTEXITCODE -ne 0) { throw 'Python copy failed' }
            docker cp "$scratch\repo\." "${cid}:C:\work"
            if ($LASTEXITCODE -ne 0) { throw 'Repository copy failed' }
            docker start -a $cid
            if ($LASTEXITCODE -ne 0) { throw 'Offline container test failed' }
            $code=docker inspect --format '{{.State.ExitCode}}' $cid
            if ($code -ne '0') { throw "Offline container exited $code" }
          } finally { docker rm -f $cid }
