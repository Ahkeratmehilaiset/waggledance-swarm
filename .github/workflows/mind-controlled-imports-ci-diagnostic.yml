name: Synthetic controlled imports Linux diagnostic
on:
  push:
    branches: [diag/q4-controlled-import-linux-20261111]
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=9.0.3'
      - name: Test synthetic import isolation without network
        run: |
          sudo unshare --net -- "$(command -v python)" -m pytest -q -p no:cacheprovider tests/tools/test_wd_q4_controlled_imports.py::test_main_alias_is_bound_to_bootstrap_and_verified_stdlib_source tests/tools/test_wd_q4_controlled_imports.py::test_posix_stdlib_alias_refuses_site_packages_search tests/tools/test_wd_q4_controlled_imports.py::test_posix_site_exclusion_witness_detects_synthetic_mutant
