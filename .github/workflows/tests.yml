name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  # Stable across heads of one PR, distinct across workflows and non-PR runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || 'run' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unified:
    runs-on: ubuntu-latest
    # In 39 runs (2026-09-29..10-05) passing runs took 24.7-29.9 min and 20 runs
    # were cancelled at the old 30-minute limit (30.25-30.35 min), one measured
    # at 84% about a minute from the end; 60 matches branches that used it.
    # On 2026-10-12 the 60-minute limit cancelled PR #1864 (job 38228348100) at
    # the [ 95%] pytest mark after 56.2 min in pytest (29,344 items); main's run
    # 38221355158 spent 53.2 min in pytest, and the ci.yml matrix jobs (-q, no
    # limit) 49.2-55.6 min in tests. The need is about 64 min (3.3 before pytest,
    # about 60 in it); 90 is a bounded margin, pinned by
    # tests/tools/test_ci_unified_budget_contract.py.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # full history needed by tests/phase10/test_truth_regression.py (merge-base --is-ancestor against squash-merge SHAs)

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvoikko1 voikko-fi

    - name: Install Python dependencies
      run: |
        pip install -r requirements-ci.txt 2>&1 | tee /tmp/pip-install.log
        echo "--- pip install completed ---"

    - name: Upload pip log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: pip-install-log
        path: /tmp/pip-install.log

    - name: Compile all Python files
      run: |
        python -m compileall core memory web waggledance backend integrations tests -q

    - name: Run legacy tests (informational)
      run: |
        python tests/run_all.py --skip-ollama || echo "Legacy tests exited $? (expected without Ollama)"

    - name: Run pytest
      run: |
        python -m pytest tests/ -v --tb=short
        python -m pytest sandbox/mind/test_mind_capture_producer_reader.py sandbox/mind/test_mind_capture_producer_state.py sandbox/mind/test_join_turn.py sandbox/mind/test_join_card.py sandbox/mind/test_join_card_delivery.py sandbox/mind/step1/test_adapter.py sandbox/mind/step1/test_lane_view.py sandbox/mind/capture/test_capacity_lens.py sandbox/mind/capture/test_overlap_lens.py sandbox/mind/test_mind_chain_driver.py sandbox/mind/step2/test_q4_readonly_port.py sandbox/mind/step2/test_wd_q4_private_read.py sandbox/mind/step2/test_reader_slot.py sandbox/mind/step2/test_runtime_manifest.py sandbox/mind/step2/test_runtime_bootstrap.py sandbox/mind/step2/test_runtime_builder.py sandbox/mind/step2/test_runtime_launcher.py sandbox/mind/step2/test_shared_projection.py sandbox/mind/step2/test_shared_projection_q4_synthetic.py sandbox/mind/step2/test_shared_result_resolver.py sandbox/mind/step2/test_shared_capture_adapter.py sandbox/mind/step2/test_shared_bridge_snapshot.py sandbox/mind/step2/test_shared_index_checkpoint.py sandbox/mind/step2/test_shared_index_builder.py sandbox/mind/step2/test_shared_source_anchor.py sandbox/mind/step2/test_shared_strict_chain.py sandbox/mind/step2/test_shared_builder_e2e.py sandbox/mind/step2/test_shared_history.py sandbox/mind/step2/test_shared_index_watermark.py sandbox/mind/step2/test_status_metadata_producer.py sandbox/mind/step2/test_status_public_filter.py -v --tb=short

    - name: Run benchmark baseline
      run: |
        mkdir -p data
        python tools/run_benchmark.py --yaml configs/benchmarks.yaml

    - name: Upload benchmark artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-v2_0
        path: |
          data/benchmark_v1_18.json
          data/benchmark_v1_18_summary.md

  lock-resolver-check:
    # Catches cross-package resolver conflicts in requirements.lock.txt at
    # PR time (e.g. PR #584's moviepy<12.0 vs pillow==12.2.0 conflict that
    # the static lock-floor tests cannot surface). See
    # tools/check_lock_resolves.py for the implementation contract.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Run lock resolver gate (dry-run, fail-closed)
      run: |
        python tools/check_lock_resolves.py \
          --lock-file requirements.lock.txt \
          --extra-index-url https://download.pytorch.org/whl/cu126 \
          --output /tmp/lock_resolver_report.json

    - name: Upload resolver report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lock-resolver-report
        path: /tmp/lock_resolver_report.json
