name: Q4 isolated Windows diagnostic ONLY
on:
  workflow_dispatch:
permissions: {}
jobs:
  isolated-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies before network isolation
        shell: pwsh
        run: |
          python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run synthetic continuation on isolated runner
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected an ephemeral GitHub-hosted Windows runner' }
          $blob = git hash-object tests/tools/test_wd_q4_adopt_recovery_ps.py
          if ($LASTEXITCODE -ne 0 -or $blob -ne 'e83887d8a8a155f52ba9c3107b543fb40e5700aa') { throw 'Test file does not match the selected source head' }
          $ruleName = 'wd-q4-diagnostic-deny-' + $env:GITHUB_RUN_ID
          $tmp = 'C:\wd-q4-diagnostic-' + $env:GITHUB_RUN_ID
          if (Test-Path -LiteralPath $tmp) { throw 'Diagnostic temporary path already exists' }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $env:TEMP = $tmp
          $env:TMP = $tmp
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          Remove-Item Env:WD_Q4_ADOPT_JOB_E2E -ErrorAction SilentlyContinue
          foreach ($item in @(Get-ChildItem Env:)) {
            if ($item.Name -match '(?i)(TOKEN|SECRET|PASSWORD|CREDENTIAL|API_KEY)') {
              Remove-Item -LiteralPath ('Env:' + $item.Name) -ErrorAction SilentlyContinue
            }
          }
          $testExit = 1
          try {
            New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Enabled True -Profile Any -RemoteAddress Any | Out-Null
            $rule = Get-NetFirewallRule -Name $ruleName -ErrorAction Stop
            if ($rule.Enabled -ne 'True' -or $rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block') { throw 'Outbound isolation rule not active' }
            $socket = [System.Net.Sockets.TcpClient]::new()
            try {
              $connection = $socket.BeginConnect('1.1.1.1', 443, $null, $null)
              if ($connection.AsyncWaitHandle.WaitOne(2500) -and $socket.Connected) { throw 'Outbound isolation probe unexpectedly connected' }
            } finally { $socket.Dispose() }
            Write-Host 'Outbound isolation active; test starts.'
            python -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py::test_active_real_adoption_blocks_recovery_job -q -rs -p no:cacheprovider --basetemp "$tmp\pytest" --junitxml "$tmp\result.xml"
            $testExit = $LASTEXITCODE
            if ($testExit -eq 0) {
              [xml]$result = Get-Content -Raw -LiteralPath "$tmp\result.xml"
              $suite = $result.testsuites.testsuite
              if ($suite.tests -ne '1' -or $suite.skipped -ne '0' -or $suite.failures -ne '0' -or $suite.errors -ne '0') { throw 'Diagnostic test was not executed and passed exactly once' }
            }
          } finally {
            Get-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue | Remove-NetFirewallRule
            if (Get-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue) { throw 'Diagnostic firewall cleanup failed' }
            Write-Host 'Diagnostic outbound block removed.'
          }
          exit $testExit
      - name: Remove diagnostic firewall rule after interrupted step
        if: always()
        shell: pwsh
        run: |
          $name = 'wd-q4-diagnostic-deny-' + $env:GITHUB_RUN_ID
          Get-NetFirewallRule -Name $name -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          if (Get-NetFirewallRule -Name $name -ErrorAction SilentlyContinue) { throw 'Diagnostic firewall cleanup failed' }
