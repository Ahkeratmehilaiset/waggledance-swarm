name: Release stable Docker images to GHCR

# Stable-promotion workflow. It publishes the versioned canonical tag first,
# smokes that exact digest, and only then moves any sliding aliases.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable git tag to publish (e.g. v3.12.0). Must be strict semver."
        required: true
        type: string
      move_latest:
        description: "Move :latest to this tag (yes/no). Default no — operator must opt-in."
        required: true
        type: choice
        options: ["yes", "no"]
        default: "no"
      profile_aliases:
        description: "Update small-stable / medium-stable Profile aliases (yes/no)"
        required: false
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: read
  packages: write

concurrency:
  group: waggledance-docker-release-aliases
  queue: max
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Validate strict stable tag
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: python
        run: |
          import os
          import re
          import sys

          tag = os.environ.get("INPUT_TAG", "")
          if (
              len(tag) > 128
              or re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None
          ):
              print(
                  f"::error::Tag {tag!r} is not strict semver vMAJOR.MINOR.PATCH",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
              newline="\n",
          ) as output:
              output.write(f"tag={tag}\n")

  build-and-push:
    needs: validate-tag
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.canonical.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate-tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push canonical stable image
        id: canonical
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/ahkeratmehilaiset/waggledance:${{ needs.validate-tag.outputs.tag }}

  smoke-test:
    needs: [validate-tag, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REF: ghcr.io/ahkeratmehilaiset/waggledance@${{ needs.build-and-push.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull canonical digest
        run: docker pull "$SOURCE_REF"

      - name: Smoke — Profile S clean import + redactor + LLM disabled
        run: |
          docker run --rm \
            -e WAGGLE_PROFILE=small \
            "$SOURCE_REF" \
            python -c "
          import sys
          from waggledance.core.bridge_llm import (
              BridgeLLMClient, LLMRequest, BridgeLLMRedactor,
          )
          leaked = [n for n in ('anthropic', 'openai', 'ollama', 'vertexai',
                                  'cohere', 'groq')
                     if n in sys.modules]
          assert not leaked, f'Profile S regression at stable: {leaked}'
          assert not BridgeLLMClient.disabled('profile_s_stable').is_enabled()
          assert BridgeLLMRedactor().redact('alice@example.org').applied
          print('SMOKE_OK_STABLE')
          "

  promote-aliases:
    needs: [validate-tag, build-and-push, smoke-test]
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ghcr.io/ahkeratmehilaiset/waggledance@${{ needs.build-and-push.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag :stable sliding alias
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/ahkeratmehilaiset/waggledance:stable \
            "$SOURCE_REF"

      - name: Tag Profile S stable alias
        if: ${{ inputs.profile_aliases == 'yes' }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/ahkeratmehilaiset/waggledance:small-stable \
            "$SOURCE_REF"

      - name: Tag Profile M stable alias
        if: ${{ inputs.profile_aliases == 'yes' }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/ahkeratmehilaiset/waggledance:medium-stable \
            "$SOURCE_REF"

      - name: Tag :latest (operator-gated)
        if: ${{ inputs.move_latest == 'yes' }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/ahkeratmehilaiset/waggledance:latest \
            "$SOURCE_REF"

  verify-aliases:
    needs: [validate-tag, build-and-push, promote-aliases]
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ghcr.io/ahkeratmehilaiset/waggledance@${{ needs.build-and-push.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify :stable alias resolves to canonical digest
        run: |
          EXPECTED_DIGEST="${SOURCE_REF#*@}"
          STABLE_DIGEST=$(
            docker buildx imagetools inspect \
              ghcr.io/ahkeratmehilaiset/waggledance:stable \
              --format '{{json .Manifest}}' |
              python -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          )
          if [ "$STABLE_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::stable alias does not resolve to canonical digest"
            exit 1
          fi

      - name: Verify Profile S stable alias
        if: ${{ inputs.profile_aliases == 'yes' }}
        run: |
          EXPECTED_DIGEST="${SOURCE_REF#*@}"
          ALIAS_DIGEST=$(
            docker buildx imagetools inspect \
              ghcr.io/ahkeratmehilaiset/waggledance:small-stable \
              --format '{{json .Manifest}}' |
              python -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          )
          if [ "$ALIAS_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Profile S stable alias does not resolve to canonical digest"
            exit 1
          fi

      - name: Verify Profile M stable alias
        if: ${{ inputs.profile_aliases == 'yes' }}
        run: |
          EXPECTED_DIGEST="${SOURCE_REF#*@}"
          ALIAS_DIGEST=$(
            docker buildx imagetools inspect \
              ghcr.io/ahkeratmehilaiset/waggledance:medium-stable \
              --format '{{json .Manifest}}' |
              python -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          )
          if [ "$ALIAS_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Profile M stable alias does not resolve to canonical digest"
            exit 1
          fi

      - name: Verify :latest only if moved
        if: ${{ inputs.move_latest == 'yes' }}
        run: |
          EXPECTED_DIGEST="${SOURCE_REF#*@}"
          LATEST_DIGEST=$(
            docker buildx imagetools inspect \
              ghcr.io/ahkeratmehilaiset/waggledance:latest \
              --format '{{json .Manifest}}' |
              python -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          )
          if [ "$LATEST_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::latest alias does not resolve to canonical digest after move"
            exit 1
          fi
