name: Mind adoption platform coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || 'run' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adopt-platform-linux:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
      - name: Portable tests with outbound denial
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != 'github-hosted' ]; then echo 'Expected disposable hosted Linux' >&2; exit 1; fi
          command -v pwsh
          scratch="$RUNNER_TEMP/wd-adopt-$GITHUB_RUN_ID"
          mkdir -p "$scratch/home" "$scratch/tmp"
          rule="wd-adopt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            local tool remaining failed=0
            for tool in iptables ip6tables; do
              if ! remaining="$(sudo "$tool" -S OUTPUT)"; then echo "$tool inspection failed" >&2; failed=1; continue; fi
              case "$remaining" in
                *"$rule"*)
                  if ! sudo "$tool" -D OUTPUT -m comment --comment "$rule" -j REJECT; then echo "$tool rule removal failed" >&2; failed=1; continue; fi
                  if ! remaining="$(sudo "$tool" -S OUTPUT)"; then echo "$tool inspection failed" >&2; failed=1; continue; fi
                  case "$remaining" in *"$rule"*) echo "$tool rule remains" >&2; failed=1 ;; esac
                  ;;
              esac
            done
            return "$failed"
          }
          trap 'cleanup || exit 1' EXIT
          sudo iptables -I OUTPUT 1 -m comment --comment "$rule" -j REJECT
          sudo ip6tables -I OUTPUT 1 -m comment --comment "$rule" -j REJECT
          sudo iptables -C OUTPUT -m comment --comment "$rule" -j REJECT
          sudo ip6tables -C OUTPUT -m comment --comment "$rule" -j REJECT
          env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" python -c 'import socket,sys; s=socket.socket(); s.settimeout(2); r=s.connect_ex(("1.1.1.1",443)); s.close(); sys.exit(1 if r == 0 else 0)'
          env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" python -c 'import socket,sys; s=socket.socket(socket.AF_INET6,socket.SOCK_STREAM); s.settimeout(2); r=s.connect_ex(("2606:4700:4700::1111",443,0,0)); s.close(); sys.exit(1 if r == 0 else 0)'
          env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" python -c 'import sys; sys.exit(1 if sys.flags.optimize != 0 else 0)'
          mkdir -p "$scratch/source"
          git archive --format=tar --output "$scratch/source.tar" HEAD -- 'pyproject.toml' 'tests/conftest.py' 'tests/tools/test_card_source_binding.py' 'tests/tools/test_lane_card_decision_forward.py' 'tests/tools/test_public_card_decision_forward.py' 'tests/tools/test_shared_card_projection.py' 'tests/tools/test_shared_card_route.py' ':(glob)tests/tools/test_wd_q4*.py' ':(glob)tools/*.py' ':(glob)tools/**/*.py' ':(glob)sandbox/mind/*.py' ':(glob)sandbox/mind/**/*.py' ':(glob)waggledance/**/*.py' ':(glob)core/*.py' ':(glob)core/**/*.py' ':(glob)ops/windows/reboot/*.ps1'
          tar -xf "$scratch/source.tar" -C "$scratch/source"
          ( cd "$scratch/source"; env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py --collect-only -q -p no:cacheprovider > "$scratch/collected.txt" )
          cat "$scratch/collected.txt"
          grep -E '^38 tests collected' "$scratch/collected.txt"
          ( cd "$scratch/source"; env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py -q -rs -p no:cacheprovider --basetemp "$scratch/pytest" --junitxml "$scratch/results.xml" )
          env -i PATH="$PATH" HOME="$scratch/home" python -c 'import sys,xml.etree.ElementTree as E; s=E.parse(sys.argv[1]).getroot().find("testsuite"); c=s.findall("testcase"); ids={(x.attrib.get("classname",""),x.attrib.get("name","")) for x in c}; k=sum(x.find("skipped") is not None for x in c); bad=sum(x.find("failure") is not None or x.find("error") is not None for x in c); p={x.attrib["name"] for x in c if x.find("skipped") is None}; e={"test_default_off","test_bad_pins_refuse_without_job","test_marker_window_starts_after_synthetic_preflight","test_preflight_and_marker_waits_remain_bounded[False]","test_preflight_and_marker_waits_remain_bounded[True]"}; (len(c)==38 and len(ids)==38 and k==33 and bad==0 and p==e and s.attrib["skipped"]=="33" and s.attrib["failures"]=="0" and s.attrib["errors"]=="0") or sys.exit("Linux adoption coverage mismatch"); print("verified Linux: 5 passed, 33 skipped")' "$scratch/results.xml"
          ( cd "$scratch/source"; env -i PATH="$PATH" HOME="$scratch/home" TMPDIR="$scratch/tmp" PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -rs -p no:cacheprovider --basetemp "$scratch/continuation-pytest" --junitxml "$scratch/continuation-results.xml" tests/tools/test_wd_q4_continuation_orchestrator.py::test_anchored_template_validates_real_synthetic_files_and_pinned_script tests/tools/test_wd_q4_continuation_orchestrator.py::test_tampered_tuple_is_refused_before_attempt tests/tools/test_wd_q4_continuation_orchestrator.py::test_fixed_process_invokes_real_job_bootstrap_and_cli_with_synthetic_continuation tests/tools/test_wd_q4_continuation_orchestrator_cli.py::test_real_config_and_template_are_both_hash_bound tests/tools/test_wd_q4_continuation_job_v3.py tests/tools/test_wd_q4_continuation_orchestrator_job.py )
          env -i PATH="$PATH" HOME="$scratch/home" python -c 'import sys,xml.etree.ElementTree as E; s=E.parse(sys.argv[1]).getroot().find("testsuite"); c=s.findall("testcase"); ids={(x.attrib.get("classname",""),x.attrib.get("name","")) for x in c}; k=sum(x.find("skipped") is not None for x in c); bad=sum(x.find("failure") is not None or x.find("error") is not None for x in c); p={x.attrib["name"] for x in c if x.find("skipped") is None}; e={"test_launcher_default_off","test_launcher_refuses_invalid_config_without_starting_job"}; (len(c)==12 and len(ids)==12 and k==10 and bad==0 and p==e and s.attrib["skipped"]=="10" and s.attrib["failures"]=="0" and s.attrib["errors"]=="0") or sys.exit("Linux continuation coverage mismatch"); print("verified Linux continuation: 2 passed, 10 Windows-only skipped")' "$scratch/continuation-results.xml"
      - name: Cleanup firewall
        if: always()
        shell: bash
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" != 'github-hosted' ]; then echo 'Expected disposable hosted Linux' >&2; exit 1; fi
          rule="wd-adopt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            local tool remaining failed=0
            for tool in iptables ip6tables; do
              if ! remaining="$(sudo "$tool" -S OUTPUT)"; then echo "$tool inspection failed" >&2; failed=1; continue; fi
              case "$remaining" in
                *"$rule"*)
                  if ! sudo "$tool" -D OUTPUT -m comment --comment "$rule" -j REJECT; then echo "$tool rule removal failed" >&2; failed=1; continue; fi
                  if ! remaining="$(sudo "$tool" -S OUTPUT)"; then echo "$tool inspection failed" >&2; failed=1; continue; fi
                  case "$remaining" in *"$rule"*) echo "$tool rule remains" >&2; failed=1 ;; esac
                  ;;
              esac
            done
            return "$failed"
          }
          cleanup || exit 1
  adopt-platform-windows:
    permissions: {}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare dependencies before offline container
        shell: pwsh
        run: |
          python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
      - name: Run exact synthetic coverage in offline Windows container
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected disposable hosted Windows' }
          $service = Get-Service -Name docker -ErrorAction Stop
          if ($service.Status -ne 'Running') { Start-Service docker }
          $positive=[Net.Sockets.TcpClient]::new()
          try { $a=$positive.BeginConnect('140.82.114.4',443,$null,$null); if (-not $a.AsyncWaitHandle.WaitOne(5000)) { throw 'Positive network control timed out' }; $positive.EndConnect($a) } finally { $positive.Dispose() }
          Write-Output 'Host positive network control connected'
          $image = 'mcr.microsoft.com/windows/servercore@sha256:c622317822fefb54a056fd09ab51f5bb48390feb47abb2b8696b2c526bdce4ef'
          $scratch = Join-Path $env:RUNNER_TEMP 'wd-synthetic-archive'
          New-Item -ItemType Directory -Path "$scratch\repo" -Force | Out-Null
          # Source-only subset used by the synthetic fixture. Never archive .git,
          # documents, runtime data or the host workspace outside tracked source.
          $sourcePaths = @('pyproject.toml','tests/conftest.py','tests/tools/test_card_source_binding.py','tests/tools/test_lane_card_decision_forward.py','tests/tools/test_public_card_decision_forward.py','tests/tools/test_shared_card_projection.py','tests/tools/test_shared_card_route.py',':(glob)tests/tools/test_wd_q4*.py',':(glob)tools/*.py',':(glob)tools/**/*.py',':(glob)sandbox/mind/*.py',':(glob)sandbox/mind/**/*.py',':(glob)waggledance/**/*.py',':(glob)core/*.py',':(glob)core/**/*.py',':(glob)ops/windows/reboot/*.ps1')
          git archive --format=tar --output "$scratch\repo.tar" HEAD -- $sourcePaths
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          tar -xf "$scratch\repo.tar" -C "$scratch\repo"
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          # Parse, never import, reachable fixture modules; check static imports and
          # literal spec_from_file_location/with_name targets against the archive.
          $closure = @'
          import ast, pathlib, re, sys
          root=pathlib.Path('tests/tools'); staged=pathlib.Path(sys.argv[1])/'tests/tools'
          todo=['test_wd_q4_adopt_recovery_ps','test_wd_q4_continuation_orchestrator',
                'test_wd_q4_continuation_orchestrator_cli','test_wd_q4_continuation_job_v3',
                'test_wd_q4_continuation_orchestrator_job']; seen=set()
          while todo:
              name=todo.pop()
              if name in seen: continue
              seen.add(name); original=root/(name+'.py'); copy=staged/(name+'.py')
              if not original.is_file() or not copy.is_file(): raise SystemExit('missing fixture: '+name)
              tree=ast.parse(original.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node,ast.ImportFrom) and node.module:
                      if node.module.startswith('tests.tools.test_'): todo.append(node.module.split('.')[2])
                      if node.module=='tests.tools': todo.extend(a.name for a in node.names if a.name.startswith('test_'))
                  if isinstance(node,ast.Import):
                      todo.extend(a.name.split('.')[2] for a in node.names if a.name.startswith('tests.tools.test_'))
                  if isinstance(node,ast.Constant) and isinstance(node.value,str):
                      for dep in re.findall(r'(?:tests[/\\]tools[/\\])?(test_[a-zA-Z0-9_]+)\.py',node.value):
                          if (root/(dep+'.py')).is_file(): todo.append(dep)
          print('static fixture closure present:',len(seen))
          '@
          python -c $closure "$scratch\repo"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture source closure incomplete' }
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw 'Image unavailable' }
          $pythonRoot = (& python -c 'import sys; print(sys.base_prefix)').Trim()
          $inner = @'
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:\wdtmp -Force | Out-Null
          $env:TEMP='C:\wdtmp'; $env:TMP='C:\wdtmp'; $env:HOME='C:\wdtmp'; $env:USERPROFILE='C:\wdtmp'
          $env:PATH='C:\Python;C:\Python\Scripts;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw 'Windows PowerShell is not on PATH' }
          $env:PYTHONDONTWRITEBYTECODE='1'; $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'
          Remove-Item Env:PYTHONOPTIMIZE -ErrorAction SilentlyContinue
          & C:\Python\python.exe -c "import sys; sys.exit(0 if sys.flags.optimize == 0 else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Optimized Python is not allowed' }
          if (Get-ChildItem Env: | Where-Object { $_.Name -match '(?i)token|secret|password|credential|^GITHUB_' }) { throw 'Unexpected credential-like environment key' }
          if ($env:WD_Q4_ADOPT_JOB_E2E) { throw 'Live runtime opt-in present' }
          $s=[Net.Sockets.TcpClient]::new()
          try { $a=$s.BeginConnect('140.82.114.4',443,$null,$null); if ($a.AsyncWaitHandle.WaitOne(5000)) { $s.EndConnect($a); throw 'Network connected' } } catch [System.Net.Sockets.SocketException] { Write-Output 'Socket denied' } finally { $s.Dispose() }
          & C:\Python\python.exe -c "import socket,sys; s=socket.socket(); s.settimeout(3); r=s.connect_ex(('140.82.114.4',443)); s.close(); sys.exit(1 if r == 0 else 0)"
          if ($LASTEXITCODE -ne 0) { throw 'Python network control failed' }
          Set-Location C:\work
          & C:\Python\python.exe -m pytest tests/tools/test_wd_q4_adopt_recovery_ps.py -q -rs -p no:cacheprovider --basetemp C:\wdtmp\pytest --junitxml C:\wdtmp\results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic tests failed' }
          [xml]$result = Get-Content -Raw C:\wdtmp\results.xml
          $suite=$result.testsuites.testsuite; $cases=@($suite.testcase); $skipped=@($cases | Where-Object {$null -ne $_.SelectSingleNode('skipped')})
          $expected=@('test_real_job_finishes_proven_early_refusal','test_stdout_error_after_real_f3_mutation_is_unknown')
          if ($cases.Count -ne 38 -or @($cases.name | Sort-Object -Unique).Count -ne 38 -or $skipped.Count -ne 2 -or @($skipped | Where-Object {$_.name -notin $expected}).Count -ne 0 -or @($cases | Where-Object {$null -ne $_.SelectSingleNode('failure') -or $null -ne $_.SelectSingleNode('error')}).Count -ne 0 -or $suite.failures -ne '0' -or $suite.errors -ne '0') { throw 'Coverage mismatch' }
          Write-Output 'Windows coverage: 36 passed and two opt-in skipped'
          # The Linux suite skips only these Windows-host / JobObject cases. Run
          # every such case here with the same offline, unmounted synthetic tree.
          $continuationTests=@(
            'tests/tools/test_wd_q4_continuation_orchestrator.py::test_anchored_template_validates_real_synthetic_files_and_pinned_script',
            'tests/tools/test_wd_q4_continuation_orchestrator.py::test_tampered_tuple_is_refused_before_attempt',
            'tests/tools/test_wd_q4_continuation_orchestrator.py::test_fixed_process_invokes_real_job_bootstrap_and_cli_with_synthetic_continuation',
            'tests/tools/test_wd_q4_continuation_orchestrator_cli.py::test_real_config_and_template_are_both_hash_bound',
            'tests/tools/test_wd_q4_continuation_job_v3.py',
            'tests/tools/test_wd_q4_continuation_orchestrator_job.py'
          )
          & C:\Python\python.exe -m pytest @continuationTests -q -rs -p no:cacheprovider --basetemp C:\wdtmp\continuation-pytest --junitxml C:\wdtmp\continuation-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Continuation synthetic tests failed' }
          [xml]$continuation = Get-Content -Raw C:\wdtmp\continuation-results.xml
          $suite=$continuation.testsuites.testsuite; $cases=@($suite.testcase)
          $expected=@('test_anchored_template_validates_real_synthetic_files_and_pinned_script',
            'test_tampered_tuple_is_refused_before_attempt',
            'test_fixed_process_invokes_real_job_bootstrap_and_cli_with_synthetic_continuation',
            'test_real_config_and_template_are_both_hash_bound',
            'test_actual_cli_through_real_job_with_synthetic_continuation',
            'test_actual_cli_job_refuses_changed_record',
            'test_launcher_default_off', 'test_launcher_refuses_invalid_config_without_starting_job',
            'test_real_job_bootstrap_cli_twice_with_synthetic_orchestrator',
            'test_real_nested_windows_jobs_use_actual_fixed_call',
            'test_interruption_is_unknown_and_pending_survives_a_second_invocation',
            'test_landed_result_with_mismatched_record_is_unknown')
          if ($cases.Count -ne 12 -or @($cases | Where-Object {$null -ne $_.SelectSingleNode('skipped') -or $null -ne $_.SelectSingleNode('failure') -or $null -ne $_.SelectSingleNode('error') -or $_.name -notin $expected}).Count -ne 0 -or
              @($cases.name | Sort-Object -Unique).Count -ne 12 -or $suite.failures -ne '0' -or $suite.errors -ne '0') { throw 'Continuation Windows coverage mismatch' }
          Write-Output 'Continuation Windows coverage: all 12 named cases passed'
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inner))
          $cid = docker create --network none --workdir C:\work $image powershell.exe -NoProfile -NonInteractive -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw 'Offline container creation failed' }
          try {
            $network=docker inspect --format '{{.HostConfig.NetworkMode}}' $cid
            if ($network -ne 'none') { throw 'Container network not isolated' }
            $mounts=docker inspect --format '{{json .Mounts}}' $cid
            if ($mounts -notin @('[]','null')) { throw 'Unexpected container mounts' }
            docker cp "$pythonRoot\." "${cid}:C:\Python"
            if ($LASTEXITCODE -ne 0) { throw 'Python copy failed' }
            docker cp "$scratch\repo\." "${cid}:C:\work"
            if ($LASTEXITCODE -ne 0) { throw 'Repository copy failed' }
            docker start -a $cid
            if ($LASTEXITCODE -ne 0) { throw 'Offline container test failed' }
            $code=docker inspect --format '{{.State.ExitCode}}' $cid
            if ($code -ne '0') { throw "Offline container exited $code" }
          } finally { docker rm -f $cid }
