name: Release Docker images to GHCR

# R21.6 — operator decision 3: GHCR primary, no Docker Hub yet.
# Triggered manually after a prerelease tag matching the R20/R21 alpha
# pattern lands. Builds four image tags per the R21 release plan and
# publishes them to ghcr.io/ahkeratmehilaiset/waggledance:*.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v3.11.0-r20-axis-b-activated-alpha)"
        required: true
        type: string
      promote_alias:
        description: "Sliding alias to update (e.g. axis-b-alpha). Empty = none."
        required: false
        type: string
        default: "axis-b-alpha"
      profile_aliases:
        description: "Update profile aliases small-* / medium-* (yes/no)"
        required: false
        type: choice
        options: ["yes", "no"]
        default: "yes"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "promote_alias=axis-b-alpha" >> "$GITHUB_OUTPUT"
            echo "profile_aliases=yes" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "promote_alias=${{ inputs.promote_alias }}" >> "$GITHUB_OUTPUT"
            echo "profile_aliases=${{ inputs.profile_aliases }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish if target tag does NOT match the alpha shape
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          # Operator decision 2: only publish prerelease alpha tags from
          # this workflow. waggledance:latest must NEVER move from this
          # workflow until a stable tag arrives via a future workflow.
          if [[ ! "$TAG" =~ alpha$ ]]; then
            echo "Target tag '$TAG' does not end in 'alpha' — refusing to publish."
            echo "Stable tags require a separate workflow with explicit operator gate."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Canonical image (full tag from operator decision 2 / 3)
      - name: Build and push canonical image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/ahkeratmehilaiset/waggledance:${{ steps.target.outputs.tag }}
          # NOTE: waggledance:latest is intentionally NOT updated here
          # per operator decision 2 ("do NOT promote to v3.11.0 stable").

      # Sliding alias (e.g. axis-b-alpha)
      - name: Tag sliding alias
        if: ${{ steps.target.outputs.promote_alias != '' }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/ahkeratmehilaiset/waggledance:${{ steps.target.outputs.promote_alias }} \
            ghcr.io/ahkeratmehilaiset/waggledance:${{ steps.target.outputs.tag }}

      # Profile S/M aliases (operator decision 3 image plan).
      # The Dockerfile is single-stage; the small/medium variants share
      # the same image but document the supported deployment profile via
      # tag aliasing. Real Profile S filtering happens at runtime via
      # WAGGLE_PROFILE / Start-WaggleDanceSolver.ps1 + solver-profiles/*.json.
      - name: Tag Profile S alias
        if: ${{ steps.target.outputs.profile_aliases == 'yes' }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/ahkeratmehilaiset/waggledance:small-axis-b-alpha \
            ghcr.io/ahkeratmehilaiset/waggledance:${{ steps.target.outputs.tag }}

      - name: Tag Profile M alias
        if: ${{ steps.target.outputs.profile_aliases == 'yes' }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/ahkeratmehilaiset/waggledance:medium-axis-b-alpha \
            ghcr.io/ahkeratmehilaiset/waggledance:${{ steps.target.outputs.tag }}

  smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve target tag (smoke)
        id: target
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: docker pull
        run: |
          docker pull ghcr.io/ahkeratmehilaiset/waggledance:${{ steps.target.outputs.tag }}

      - name: docker run — module-import sanity
        run: |
          # Profile S smoke: the image must boot to a Python prompt and
          # importing waggledance.core.bridge_llm must NOT pull in any
          # cloud LLM SDK. Operator decision 4 "fail closed if redaction
          # is unavailable" is enforced inside the package; the import
          # discipline is the canary.
          docker run --rm \
            -e WAGGLE_PROFILE=small \
            ghcr.io/ahkeratmehilaiset/waggledance:${{ steps.target.outputs.tag }} \
            python -c "
          import sys
          from waggledance.core.bridge_llm import (
              BridgeLLMClient, LLMRequest, BridgeLLMRedactor,
          )
          leaked = [n for n in ('anthropic', 'openai', 'ollama')
                     if n in sys.modules]
          assert not leaked, f'Profile S regression: {leaked}'
          assert not BridgeLLMClient.disabled('profile_s').is_enabled()
          assert BridgeLLMRedactor().redact('alice@example.org').applied
          print('SMOKE_OK')
          "
