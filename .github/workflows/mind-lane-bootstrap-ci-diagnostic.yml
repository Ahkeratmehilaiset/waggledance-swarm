name: Synthetic lane bootstrap Linux diagnostic
on:
  push:
    branches: [diag/q4-lane-bootstrap-linux-20261111]
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install 'pytest>=9.0.3'
      - name: Inspect interpreter and run synthetic tests without network
        run: |
          sudo unshare --net -- "$(command -v python)" -c 'import pathlib,sys; p=pathlib.Path(sys.executable); print("interpreter",p,"symlink",p.is_symlink(),"resolved",p.resolve(strict=True))'
          sudo unshare --net -- "$(command -v python)" -m pytest -q -p no:cacheprovider tests/tools/test_wd_q4_lane_caller_runtime_bootstrap.py
