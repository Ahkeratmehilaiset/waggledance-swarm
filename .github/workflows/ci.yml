name: Q4 refusal Windows credentialless control ONLY
on:
  workflow_dispatch:
permissions: {}
jobs:
  refusal-control:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
          ref: 28150f0adb4c84782fa08fece8bb0f283e040fb7
      - name: Verify exact candidate commit and script blob
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '28150f0adb4c84782fa08fece8bb0f283e040fb7') { throw 'Candidate head mismatch' }
          if ((git rev-parse HEAD:ops/windows/reboot/Invoke-WdQ4AdoptRecovery.ps1) -ne 'd4ddef17af517807dc32984ecc36faaab9d4a58a') { throw 'Candidate script blob mismatch' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install diagnostic test dependencies
        run: python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
      - name: Run only empty-pin refusal without runner-wide firewall
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected GitHub-hosted Windows' }
          $scratch = 'C:\wd-adopt-refusal-control-' + $env:GITHUB_RUN_ID
          if (Test-Path -LiteralPath $scratch) { throw 'Control temporary path already exists' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Get-Command python -ErrorAction Stop).Source
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = (Get-Location).Path
          $psi.Environment.Clear()
          foreach ($key in @('SystemRoot','windir','SystemDrive','ComSpec','PATHEXT','PATH','PROCESSOR_ARCHITECTURE','NUMBER_OF_PROCESSORS')) {
            $value = [Environment]::GetEnvironmentVariable($key)
            if ($value) { $psi.Environment[$key] = $value }
          }
          foreach ($entry in @{TEMP=$scratch; TMP=$scratch; USERPROFILE=$scratch; HOME=$scratch; PYTHONDONTWRITEBYTECODE='1'; PYTEST_DISABLE_PLUGIN_AUTOLOAD='1'}.GetEnumerator()) { $psi.Environment[$entry.Key] = $entry.Value }
          foreach ($arg in @('-m','pytest','tests/tools/test_wd_q4_adopt_recovery_ps.py::test_bad_pins_refuse_without_job','-q','-rs','-p','no:cacheprovider','--basetemp',"$scratch\pytest",'--junitxml',"$scratch\results.xml")) { [void]$psi.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($psi)
          if (-not $process.WaitForExit(90000)) { $process.Kill($true); $process.WaitForExit(); throw 'Control timed out' }
          if ($process.ExitCode -ne 0) { throw 'Control test failed' }
          [xml]$result = Get-Content -Raw -LiteralPath "$scratch\results.xml"
          $suite = $result.testsuites.testsuite
          if ($suite.tests -ne '1' -or $suite.skipped -ne '0' -or $suite.failures -ne '0' -or $suite.errors -ne '0') { throw 'Control did not pass exactly once' }
