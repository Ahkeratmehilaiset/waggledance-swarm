  sense.mqtt_ingest: {classification: required, target_kind: catalog_capability, target_id: sense.mqtt_ingest}
  solve.causal: {classification: required, target_kind: catalog_capability, target_id: solve.causal}
  solve.constraints: {classification: required, target_kind: catalog_capability, target_id: solve.constraints}
