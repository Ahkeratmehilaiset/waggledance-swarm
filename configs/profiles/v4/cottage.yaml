  alerts: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  device_enrollment: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "Factory device enrollment is outside the COTTAGE integration surface."}
  electricity: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  frigate: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "Frigate camera events are outside the COTTAGE integration surface."}
  home_assistant: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "Home Assistant is outside the standalone COTTAGE integration surface."}
  local_model: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "GADGET-local model packaging is outside the COTTAGE integration surface."}
  mqtt: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  offline_queue: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  otel: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "Factory OTEL export is outside the COTTAGE integration surface."}
  power_loss_recovery: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "GADGET power-loss recovery is outside the COTTAGE integration surface."}
  prometheus: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "Factory Prometheus export is outside the COTTAGE integration surface."}
  sensors: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "GADGET direct sensor binding is outside the COTTAGE integration surface."}
  signed_ota: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "GADGET signed OTA is outside the COTTAGE integration surface."}
  voice_audio: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  watchdogs: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "Factory hardware watchdogs are outside the COTTAGE integration surface."}
  weather: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}

probes:
  backup_restore: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  clock_sync: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  config_schema: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  hardware_readiness: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  integration_readiness: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  receipt_chain: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  required_capabilities: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  secret_non_exposure: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}
  unexpected_remote_provider_reachability: {classification: not_applicable, enabled_by_default: false, release_required: false, initial_state: ABSENT, rationale: "COTTAGE requires the remote provider plane, so its absence probe is not applicable."}
  unexpected_vector_backend_reachability: {classification: required, enabled_by_default: true, release_required: true, initial_state: UNPROVISIONED}

