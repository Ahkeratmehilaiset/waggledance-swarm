name: C2 staged Linux diagnostic ONLY
on:
  workflow_dispatch:
permissions: {}
jobs:
  c2-staged-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: python -m pip install pytest==9.0.3 faiss-cpu==1.13.2 numpy packaging jsonschema pydantic pyyaml psutil requests
      - name: Verify exact head and Linux
        run: |
          test "$RUNNER_OS" = Linux
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "diagnostic_head=$(git rev-parse HEAD) runner_os=$RUNNER_OS"
      - name: Run focused C2 synthetic staged tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest tests/tools/test_real_c2_enforcement.py::test_staged_query_actual_c2_valid_real_still_answers -q --tb=short -p no:cacheprovider
          python -m pytest tests/tools/test_real_c2_enforcement.py -q --tb=short -p no:cacheprovider
